<title>DroneCode Lab</title>
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f7; --bg3:#fafafc;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#8e8e93;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --accent:#0071e3; --accent-soft:#e8f1fd;
  --green:#34c759; --green-soft:#e7f8ec; --red:#ff3b30; --red-soft:#ffecea; --orange:#ff9500;
  --r-lg:18px; --r-md:12px; --r-sm:9px; --pill:980px;
  --mono:ui-monospace,'SF Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Sukhumvit Set','Thonburi','Noto Sans Thai','Leelawadee UI',Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg2); color:var(--text); overflow:hidden;
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; letter-spacing:-.01em;
}
button,select,input{font-family:inherit; font-size:14px; color:inherit}
svg{flex:none; display:block}
#app{height:100%; display:flex; flex-direction:column; background:var(--bg2)}

/* ---------------- TOPBAR SINGLE-LINE FIX ---------------- */
#topbar{
  flex:none; height:50px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:0 16px; background:rgba(255,255,255,.82); backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--line);
  flex-wrap:nowrap !important; overflow-x:auto !important; white-space:nowrap !important;
  -webkit-overflow-scrolling:touch;
}
#topbar::-webkit-scrollbar { display:none !important; }
.brand{display:flex; align-items:center; gap:10px; min-width:0; flex-shrink:0}
.brand .mark{width:26px; height:26px; border-radius:7px; background:var(--text); display:grid; place-items:center; flex:none}
.brand h1{margin:0; font-size:15px; font-weight:600; letter-spacing:-.02em; white-space:nowrap}
.top-actions{display:flex; align-items:center; gap:8px; flex-wrap:nowrap !important; flex-shrink:0}

/* ---------------- CONTROLBAR SINGLE-LINE FIX ---------------- */
#controlbar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:rgba(255,255,255,.82); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  flex-wrap:nowrap !important; overflow-x:auto !important; white-space:nowrap !important;
  -webkit-overflow-scrolling:touch;
}
#controlbar::-webkit-scrollbar { display:none !important; }
.btn{
  height:34px; padding:0 16px; border-radius:var(--pill); border:0; cursor:pointer;
  font-size:14px; font-weight:500; display:inline-flex; align-items:center; gap:7px;
  background:var(--bg2); color:var(--text); white-space:nowrap; transition:background .15s, opacity .15s; flex-shrink:0;
}
.btn:hover{background:#ebebef}
.btn.primary{background:var(--accent); color:#fff}
.btn.primary:hover{background:#0064cc}
.btn.quiet{background:transparent; color:var(--text2)}
.btn.quiet:hover{background:var(--bg2)}
.btn.stop{color:var(--red)}
.btn:disabled{opacity:.35; cursor:default; background:var(--bg2); color:var(--text2)}
.btn:disabled:hover{background:var(--bg2)}
.icon-btn{
  width:34px; height:34px; border-radius:var(--pill); border:0; background:transparent; color:var(--text2);
  display:inline-grid; place-items:center; cursor:pointer; transition:background .15s; flex-shrink:0;
}
.icon-btn:hover{background:var(--bg2); color:var(--text)}
.icon-btn.on{background:var(--accent-soft); color:var(--accent)}
select.sel{
  height:34px; padding:0 30px 0 12px; border:0; border-radius:var(--r-sm); background:var(--bg2);
  color:var(--text); cursor:pointer; appearance:none; -webkit-appearance:none; max-width:250px; flex-shrink:0;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236e6e73' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M7 10l5 5 5-5'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 8px center; background-size:16px;
}
select.sel:focus{outline:2px solid var(--accent-soft)}
.seg{display:inline-flex; background:#f0f0f2; border-radius:var(--r-sm); padding:2px; gap:2px; flex-shrink:0}
.seg button{
  border:0; background:transparent; color:var(--text2); height:28px; padding:0 12px;
  border-radius:7px; cursor:pointer; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
}
.seg button.on{background:#fff; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ctl-label{font-size:13px; color:var(--text3); white-space:nowrap; flex-shrink:0}
.spacer{flex:1}
.divider{width:1px; height:22px; background:var(--line2); margin:0 2px; flex-shrink:0}

/* ---------------- LAYOUT & PANELS ---------------- */
#layout{
  flex:1; min-height:0; display:grid; gap:0; padding:14px;
  --lesson-w:320px; --code-fr:1fr; --arena-fr:1.06fr;
}
body.mode-wide  #layout{grid-template-columns:var(--lesson-w) 14px var(--code-fr) 14px var(--arena-fr); grid-template-rows:minmax(0,1fr)}
body.mode-split #layout{grid-template-columns:var(--code-fr) 14px var(--arena-fr); grid-template-rows:minmax(0,1fr)}
body.mode-single #layout{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); gap:14px}
.split-handle{
  position:relative; width:14px; cursor:col-resize; touch-action:none;
  display:flex; align-items:center; justify-content:center;
}
.split-handle::after{
  content:''; width:4px; height:44px; border-radius:3px; background:var(--line2);
  transition:background .12s, width .12s;
}
.split-handle:hover::after, .split-handle.active::after{ background:var(--accent); width:5px; }
body.mode-single .split-handle{ display:none }
body.mode-split [data-handle="lesson-code"]{ display:none }
.panel{
  background:var(--bg); border-radius:var(--r-lg); box-shadow:var(--shadow);
  display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
}
.panel-head{
  flex:none; min-height:46px; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:8px 10px 8px 16px; border-bottom:1px solid var(--line);
}
.head-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; letter-spacing:-.01em}
.head-title svg{color:var(--text3)}
.head-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.panel-body{padding:18px; overflow:auto}
#blocklyDiv{flex:1; min-height:200px; width:100%}
.mini{
  height:28px; padding:0 11px; border:0; border-radius:var(--pill); background:var(--bg2);
  color:var(--text2); font-size:12.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:5px;
}
.mini:hover{background:#ebebef; color:var(--text)}
.mini.on{background:var(--text); color:#fff}
.mini:disabled{opacity:.4; cursor:default}
.badge{font-size:12px; font-weight:500; padding:4px 10px; border-radius:var(--pill); background:var(--bg2); color:var(--text2); white-space:nowrap}
.badge.pass{background:var(--green-soft); color:#1e7f3c}
.badge.fail{background:var(--red-soft); color:#c62317}

/* ---------------- LESSON CONTENT ---------------- */
#lessonBody h3{margin:0 0 10px; font-size:19px; font-weight:600; letter-spacing:-.02em}
#lessonBody p{margin:0 0 14px; color:var(--text2)}
#lessonBody ol,#lessonBody ul{margin:0 0 14px; padding-inline-start:20px; color:var(--text2)}
#lessonBody li{margin-bottom:7px}
#lessonBody code,.ref code{font-family:var(--mono); font-size:12.5px; background:var(--bg2); border-radius:6px; padding:2px 6px; color:var(--text)}
.note{background:var(--bg2); color:var(--text2); padding:13px 15px; border-radius:var(--r-md); font-size:13px; margin-bottom:14px}
.note b{color:var(--text); font-weight:600}

/* ---------------- STAGE ---------------- */
#stageBody{position:relative; flex:1; min-height:220px; overflow:hidden}
#view3d{position:absolute; inset:0; background:#f2f2f5; cursor:grab; overflow:hidden}
#view3d:active{cursor:grabbing}
#view3d canvas{display:block}

/* ---------------- DATA SHEET / CONSOLE ---------------- */
#dataSheet{
  position:absolute; left:0; right:0; bottom:0; height:74%; min-height:230px; z-index:4;
  background:rgba(255,255,255,.97); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:blur(20px);
  border-radius:18px 18px 0 0; box-shadow:0 -6px 28px rgba(0,0,0,.10);
  display:flex; flex-direction:column; touch-action:none;
  transition:transform .32s cubic-bezier(.32,.72,0,1);
}
#dataSheet[data-state="closed"]{transform:translateY(calc(100% - 46px))}
#dataSheet[data-state="open"]{transform:translateY(0)}
#sheetHandle{
  flex:none; padding:8px 14px 9px; cursor:grab; user-select:none; -webkit-user-select:none;
  display:flex; flex-direction:column; align-items:center; gap:6px; position:relative;
}
#sheetContent{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden}
#consoleBox{flex:1; min-height:70px; overflow:auto; padding:2px 14px 14px; font-family:var(--mono); font-size:12px; line-height:1.8}

/* ---------------- OVERLAY & TOAST ---------------- */
#overlay{position:fixed; inset:0; z-index:80; display:none; place-items:center; background:var(--bg); text-align:center; padding:24px}
#overlay.active{display:grid}
.spinner{width:34px; height:34px; border-radius:50%; margin:0 auto 18px; border:2.5px solid var(--line2); border-top-color:var(--text); animation:spin 800ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- BLOCKLY & CATEGORY COLOR OVERRIDES ---------------- */
.blocklyFlyoutScrollbar { display: none !important; }
.blocklyFlyoutBackground { fill: #f5f5f7 !important; fill-opacity: 0.96 !important; rx: 16px !important; ry: 16px !important; stroke: none !important; }
.blocklyFlyoutLine { display: none !important; }
.blocklyScrollbarHandle { fill: #c7c7cc !important; rx: 4px !important; ry: 4px !important; opacity: 0.6 !important; }
.blocklyScrollbarBackground { display: none !important; }

.blocklyToolboxDiv {
  width: 145px !important;
  background-color: #fafafc !important;
  padding-top: 6px !important;
  user-select: none;
}
.blocklyTreeRoot { padding: 0 !important; }

/* Base Category Row Styling */
.blocklyTreeRow {
  display: flex !important;
  align-items: center !important;
  justify-content: flex-start !important;
  height: 36px !important;
  margin: 3px 6px 3px 0 !important;
  padding: 0 12px !important;
  border-radius: 0 18px 18px 0 !important;
  background-color: transparent !important;
  box-sizing: border-box !important;
  cursor: pointer !important;
  border-left: 5px solid var(--cat-color, #0071e3) !important;
  transition: background-color 0.15s ease, color 0.15s ease !important;
}

.blocklyTreeIcon, .blocklyTreeSeparator { display: none !important; }

.blocklyTreeLabel {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important;
  font-size: 13.5px !important;
  font-weight: 600 !important;
  line-height: 1 !important;
  padding: 0 !important;
  margin: 0 !important;
  color: var(--cat-color, #1d1d1f) !important;
}

/* Selected Category State */
.blocklyTreeRow.blocklyTreeSelected {
  background-color: var(--cat-color, #0071e3) !important;
}
.blocklyTreeRow.blocklyTreeSelected .blocklyTreeLabel {
  color: #ffffff !important;
}
.blocklyTreeRow:not(.blocklyTreeSelected):hover {
  background-color: rgba(0, 0, 0, 0.05) !important;
}

/* Category Colors via Attribute Wildcards */
.blocklyTreeRow[aria-label*="flight" i], .blocklyTreeRow[id*="flight" i], .blocklyTreeRow[class*="flight" i]       { --cat-color: #34c759 !important; }
.blocklyTreeRow[aria-label*="movement" i], .blocklyTreeRow[id*="movement" i], .blocklyTreeRow[class*="movement" i]   { --cat-color: #0071e3 !important; }
.blocklyTreeRow[aria-label*="rotation" i], .blocklyTreeRow[id*="rotation" i], .blocklyTreeRow[class*="rotation" i]   { --cat-color: #5856d6 !important; }
.blocklyTreeRow[aria-label*="lights" i], .blocklyTreeRow[id*="lights" i], .blocklyTreeRow[class*="lights" i]       { --cat-color: #ff9500 !important; }
.blocklyTreeRow[aria-label*="sensors" i], .blocklyTreeRow[id*="sensors" i], .blocklyTreeRow[class*="sensors" i]      { --cat-color: #30b0c7 !important; }
.blocklyTreeRow[aria-label*="logic" i], .blocklyTreeRow[id*="logic" i], .blocklyTreeRow[class*="logic" i]        { --cat-color: #4A90E2 !important; }
.blocklyTreeRow[aria-label*="loops" i], .blocklyTreeRow[id*="loops" i], .blocklyTreeRow[class*="loops" i]        { --cat-color: #af52de !important; }
.blocklyTreeRow[aria-label*="math" i], .blocklyTreeRow[id*="math" i], .blocklyTreeRow[class*="math" i]         { --cat-color: #ff2d55 !important; }
.blocklyTreeRow[aria-label*="text" i], .blocklyTreeRow[id*="text" i], .blocklyTreeRow[class*="text" i]         { --cat-color: #a2845e !important; }
.blocklyTreeRow[aria-label*="variables" i], .blocklyTreeRow[id*="variables" i], .blocklyTreeRow[class*="variables" i] { --cat-color: #5ac8fa !important; }
.blocklyTreeRow[aria-label*="functions" i], .blocklyTreeRow[id*="functions" i], .blocklyTreeRow[class*="functions" i] { --cat-color: #8e8e93 !important; }
</style>
</head>
<body class="mode-wide view-code">

<div id="app">

<header id="topbar">
  <div class="brand">
    <div class="mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="18" r="2.4"/>
        <rect x="9.4" y="9.4" width="5.2" height="5.2" rx="1.3"/><path d="M8 8 7.2 7.2M16 8l.8-.8M8 16l-.8.8M16 16l.8.8"/>
      </svg>
    </div>
    <h1>DroneCode Lab</h1>
  </div>
  <div class="top-actions">
    <button id="btnLesson" class="icon-btn" title="lesson">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M9 7h6M9 11h6"/></svg>
    </button>
    <div class="seg" id="langSeg">
      <button data-lang="th">ไทย</button><button data-lang="en">EN</button>
    </div>
    <button id="btnLandscape" class="icon-btn" title="landscape">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M16 3.2 18.8 6 16 8.8"/></svg>
    </button>
  </div>
</header>

<div id="controlbar">
  <select id="missionSelect" class="sel"></select>
  <button id="btnRun" class="btn primary">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>
    <span data-i18n="btn.run"></span>
  </button>
  <button id="btnPause" class="btn quiet" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg>
    <span id="pauseLabel" data-i18n="btn.pause"></span>
  </button>
  <button id="btnStop" class="btn quiet stop" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
    <span data-i18n="btn.stop"></span>
  </button>
  <button id="btnReset" class="btn quiet">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5V10H9"/></svg>
    <span data-i18n="btn.reset"></span>
  </button>
  <span class="spacer"></span>
  <span class="ctl-label" data-i18n="speed.label"></span>
  <select id="speedSelect" class="sel">
    <option value="0.5" data-i18n="speed.slow"></option>
    <option value="1" selected data-i18n="speed.normal"></option>
    <option value="2" data-i18n="speed.fast"></option>
    <option value="4" data-i18n="speed.vfast"></option>
  </select>
</div>

<main id="layout">

  <aside id="lessonPanel" class="panel">
    <div class="panel-head">
      <div class="seg" id="lessonTabs">
        <button class="on" data-lpanel="lesson" data-i18n="tab.lesson"></button>
        <button data-lpanel="reference" data-i18n="tab.reference"></button>
      </div>
      <span id="lessonBadge" class="badge"></span>
    </div>
    <div class="panel-body" id="lessonBody"></div>
    <div class="panel-body ref" id="referenceBody" style="display:none"></div>
  </aside>

  <div class="split-handle" data-handle="lesson-code" role="separator" aria-orientation="vertical"></div>

  <section id="editorPanel" class="panel">
    <div class="panel-head">
      <span class="head-title">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 16.5 5 12l4.5-4.5M14.5 7.5 19 12l-4.5 4.5"/></svg>
        <span data-i18n="panel.editor"></span>

function t(key, args){

/* ========================= PURE-LOGIC-START ========================= */

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2; }
function normDeg(d){ var x = d % 360; if (x > 180) x -= 360; if (x < -180) x += 360; return x; }
function distXZ(x, z){ return Math.sqrt(x*x + z*z); }
function round1(v){ return Math.round(v*10)/10; }

/* yaw 0 = หัวโดรนชี้ไปทาง -Z, หมุนตามเข็มนาฬิกาทำให้ yaw ลดลง */
function dirVector(dir, yawDeg){
  var y = yawDeg * Math.PI / 180;
  var f = { x:-Math.sin(y), y:0, z:-Math.cos(y) };
  var r = { x: Math.cos(y), y:0, z:-Math.sin(y) };
  switch(dir){
    case 'forward': return f;
    case 'back':    return { x:-f.x, y:0, z:-f.z };
    case 'right':   return r;
    case 'left':    return { x:-r.x, y:0, z:-r.z };
    case 'up':      return { x:0, y: 1, z:0 };
    case 'down':    return { x:0, y:-1, z:0 };
    default:        return { x:0, y:0, z:0 };
  }
}

function ledRGB(name){
  var map = { off:[0,0,0], red:[255,0,0], green:[0,255,0], blue:[0,0,255], cyan:[0,255,255],
              yellow:[255,255,0], purple:[160,0,255], white:[255,255,255], orange:[255,120,0], pink:[255,60,160] };
  return map[name] || map.off;
}

/* ---- เรขาคณิตของเซ็นเซอร์: ระยะจากโดรนถึงสิ่งกีดขวางตามแนวที่หันหน้าไป ---- */
function rayObstacleDistance(px, py, pz, dx, dz, obstacles, maxRange){
  var best = maxRange;
  for (var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if (py > o.h) continue;
    var minX = o.x - o.w/2, maxX = o.x + o.w/2;
    var minZ = o.z - o.d/2, maxZ = o.z + o.d/2;
    var t0 = 0, t1 = maxRange, ta, tb, tmp;
    if (Math.abs(dx) < 1e-9){
      if (px < minX || px > maxX) continue;
    } else {
      ta = (minX - px)/dx; tb = (maxX - px)/dx;
      if (ta > tb){ tmp = ta; ta = tb; tb = tmp; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
    }
    if (Math.abs(dz) < 1e-9){
      if (pz < minZ || pz > maxZ) continue;
    } else {
      ta = (minZ - pz)/dz; tb = (maxZ - pz)/dz;
      if (ta > tb){ tmp = ta; ta = tb; tb = tmp; }
      t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
    }
    if (t0 <= t1 && t1 > 0) best = Math.min(best, Math.max(0, t0));
  }
  return best;
}

function pointInObstacle(px, py, pz, obstacles, margin){
  margin = margin || 0;
  for (var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if (py > o.h + margin) continue;
    if (Math.abs(px - o.x) <= o.w/2 + margin && Math.abs(pz - o.z) <= o.d/2 + margin) return true;
  }
  return false;
}

/* ---- คำสั่งจริงของโดรน (Tello SDK 2.0 / RoboMaster TT) ---- */
function telloCommand(type, p){
  p = p || {};
  switch(type){
    case 'takeoff':   return 'takeoff';
    case 'land':      return 'land';
    case 'emergency': return 'emergency';
    case 'stop':      return 'stop';
    case 'move':      return p.dir + ' ' + Math.round(p.dist);
    case 'rotate':    return (p.way === 'cw' ? 'cw ' : 'ccw ') + Math.round(p.deg);
    case 'flip':      return 'flip ' + p.way;
    case 'hover':     return 'delay ' + p.sec;
    case 'speed':     return 'speed ' + Math.round(p.value);
    case 'goto':      return 'go ' + Math.round(p.x) + ' ' + Math.round(p.y) + ' ' + Math.round(p.z) + ' ' + Math.round(p.speed);
    case 'curve':     return 'curve ' + [p.x1,p.y1,p.z1,p.x2,p.y2,p.z2].map(Math.round).join(' ') + ' ' + Math.round(p.speed);
    case 'led':       return 'EXT led ' + ledRGB(p.color).join(' ');
    case 'led_rgb':   return 'EXT led ' + Math.round(p.r) + ' ' + Math.round(p.g) + ' ' + Math.round(p.b);
    default:          return '# ' + type;
  }
}

/* ---- โค้ด Python ตามไลบรารี djitellopy ---- */
function pyCommand(type, p){
  p = p || {};
  switch(type){
    case 'takeoff':   return 'tello.takeoff()';
    case 'land':      return 'tello.land()';
    case 'emergency': return 'tello.emergency()';
    case 'stop':      return 'tello.send_control_command("stop")';
    case 'hover':     return 'time.sleep(' + p.sec + ')';
    case 'speed':     return 'tello.set_speed(' + p.value + ')';
    case 'flip':      return 'tello.flip_' + ({ f:'forward', b:'back', l:'left', r:'right' }[p.way] || 'forward') + '()';
    case 'rotate':    return 'tello.rotate_' + (p.way === 'cw' ? 'clockwise' : 'counter_clockwise') + '(' + p.deg + ')';
    case 'move':      return 'tello.move_' + p.dir + '(' + p.dist + ')';
    case 'goto':      return 'tello.go_xyz_speed(' + [p.x,p.y,p.z,p.speed].join(', ') + ')';
    case 'curve':     return 'tello.curve_xyz_speed(' + [p.x1,p.y1,p.z1,p.x2,p.y2,p.z2,p.speed].join(', ') + ')';
    case 'led':       return 'tello.send_expansion_command("led ' + ledRGB(p.color).join(' ') + '")';
    default:          return '# ' + type;
  }
}

var logLines = [];
var cmdLines = [];
var pyLines = [];
var activeTab = 'log';

function stamp(){
  var d = new Date();
  return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ':' + ('0'+d.getSeconds()).slice(-2);
}

function logLine(key, args, kind){
  logLines.push({ t:stamp(), key:key, args:args || null, kind:kind || 'ok' });
  if (logLines.length > 500) logLines.shift();
  if (activeTab === 'log') renderConsole();
}

function pushCmd(cmd){
  cmdLines.push(cmd);
  if (activeTab === 'cmd') renderConsole();
}

function escapeHTML(s){
  return String(s).replace(/[&<>"]/g, function(c){ return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]; });
}

function highlightPython(line){
  var s = escapeHTML(line);
  if (/^\s*#/.test(s)) return '<span class="pycom">' + s + '</span>';
  s = s.replace(/\b(for|while|if|elif|else|in|range|def|break|continue|not|and|or|True|False|import|from|as)\b/g, '<span class="pykw">$1</span>');
  s = s.replace(/\b(tello\.[a-z_]+)/g, '<span class="pyfn">$1</span>');
  s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="pynum">$1</span>');
  return '<span class="pycode">' + s + '</span>';
}

function renderConsole(){
  var box = $('consoleBox'), html = '', i;
  if (activeTab === 'log'){
    for (i=0;i<logLines.length;i++){
      var l = logLines[i];
      html += '<div class="ln ' + l.kind + '"><span class="t">' + l.t + '</span><span class="m">' + escapeHTML(t(l.key, l.args)) + '</span></div>';
    }
  } else if (activeTab === 'cmd'){
    for (i=0;i<cmdLines.length;i++){
      html += '<div class="ln cmd"><span class="t">' + (i+1) + '</span><span class="m">' + escapeHTML(cmdLines[i]) + '</span></div>';
    }
  } else {
    for (i=0;i<pyLines.length;i++){
      html += '<div class="ln"><span class="t">' + (i+1) + '</span><span class="m">' + highlightPython(pyLines[i]) + '</span></div>';
    }
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function loadScript(urls, ready){
  return new Promise(function(resolve, reject){
    var i = 0;
    (function next(){
      if (ready()) return resolve();
      if (i >= urls.length) return reject(new Error('library load failed'));
      var s = document.createElement('script');
      s.src = urls[i++];
      s.async = false;
      s.onload = function(){ ready() ? resolve() : next(); };
      s.onerror = function(){ next(); };
      document.head.appendChild(s);
    })();
  });
}

  ledMesh.position.set(0, -0.036, 0.03); droneInner.add(ledMesh);
  ledLight = new THREE.PointLight(0xffffff, 0, 1.8);
  ledLight.position.set(0, -0.08, 0.03); droneInner.add(ledLight);

  updateDroneTransform(0);
}

function disposeGroup(g){
  while (g.children.length){
    var c = g.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  }
}

function setRings(list){
  if (!THREE_OK) return;
  disposeGroup(ringGroup);
  ringMeshes = [];
  for (var i=0;i<list.length;i++){
    var r = list[i];
    var m = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.028, 10, 44),
      new THREE.MeshStandardMaterial({ color:0xff9f0a, emissive:0x5c3a00, emissiveIntensity:0.55, roughness:0.4 }));
    m.position.set(r.x*CM, r.y*CM, r.z*CM);
    m.rotation.y = (r.rotY || 0) * Math.PI/180;
    m.castShadow = true;
    ringGroup.add(m); ringMeshes.push(m);
  }
}

function setObstacles(list){
  if (!THREE_OK) return;
  disposeGroup(obstacleGroup);
  for (var i=0;i<list.length;i++){
    var o = list[i];
    var box = new THREE.Mesh(
      new THREE.BoxGeometry(o.w*CM, o.h*CM, o.d*CM),
      new THREE.MeshStandardMaterial({ color:0xd8d8de, roughness:0.9, metalness:0.05 })
    );
    box.position.set(o.x*CM, o.h*CM/2, o.z*CM);
    box.castShadow = true; box.receiveShadow = true;
    obstacleGroup.add(box);
    var edge = new THREE.Mesh(
      new THREE.BoxGeometry(o.w*CM*1.004, 0.02, o.d*CM*1.004),
      new THREE.MeshBasicMaterial({ color:0xff3b30, transparent:true, opacity:0.85 })
    );
    edge.position.set(o.x*CM, o.h*CM, o.z*CM);
    obstacleGroup.add(edge);
  }
}

function markRingPassed(i){
  if (!THREE_OK || !ringMeshes[i]) return;
  ringMeshes[i].material.color.setHex(0x34c759);
  ringMeshes[i].material.emissive.setHex(0x14532d);
}

function resetRingVisual(){
  for (var i=0;i<ringMeshes.length;i++){
    ringMeshes[i].material.color.setHex(0xff9f0a);
    ringMeshes[i].material.emissive.setHex(0x5c3a00);
  }
}

function clearTrail(){
  trailCount = 0;
  if (trailLine) trailLine.geometry.setDrawRange(0, 0);
}

function addTrailPoint(){
  if (!THREE_OK || trailCount >= trailMax) return;
  var i = trailCount*3;
  trailPos[i] = sim.x*CM; trailPos[i+1] = sim.y*CM; trailPos[i+2] = sim.z*CM;
  trailCount++;
  trailLine.geometry.setDrawRange(0, trailCount);
  trailLine.geometry.attributes.position.needsUpdate = true;
  trailLine.geometry.computeBoundingSphere();
}

function updateLEDVisual(){
  if (!THREE_OK) return;
  var rgb = sim.ledRGBv;
  var hex = (Math.round(rgb[0])<<16) | (Math.round(rgb[1])<<8) | Math.round(rgb[2]);
  ledMesh.material.emissive.setHex(hex);
  ledLight.color.setHex(hex || 0xffffff);
  ledLight.intensity = hex === 0 ? 0 : 1.2;
}

function updateDroneTransform(dt){
  if (!THREE_OK) return;
  droneGroup.position.set(sim.x*CM, sim.y*CM, sim.z*CM);
  droneGroup.rotation.y = sim.yaw * Math.PI/180;
  droneInner.rotation.x = sim.pitch + sim.flipPitch;
  droneInner.rotation.z = sim.roll + sim.flipRoll;
  droneInner.position.y = sim.flying ? Math.sin(performance.now()/430)*0.011 : 0;
  if (dt){
    propAngle += (sim.flying ? (sim.moving ? 48 : 31) : 0) * dt;
    for (var i=0;i<propGroups.length;i++) propGroups[i].rotation.y = (i % 2 === 0 ? 1 : -1) * propAngle;
  }
}

function bindCameraControls(host){
  var dragging = false, lx = 0, ly = 0, pinch = 0;
  host.addEventListener('mousedown', function(e){ dragging = true; lx = e.clientX; ly = e.clientY; });
  window.addEventListener('mouseup', function(){ dragging = false; });
  window.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var d = viewDelta(e.clientX - lx, e.clientY - ly);
    camState.theta -= d.x*0.006;
    camState.phi = clamp(camState.phi - d.y*0.005, 0.12, 1.5);
    lx = e.clientX; ly = e.clientY;
  });
  host.addEventListener('wheel', function(e){
    e.preventDefault();
    camState.radius = clamp(camState.radius + e.deltaY*0.004, 1.4, 22);
  }, { passive:false });
  host.addEventListener('touchstart', function(e){
    if (e.touches.length === 1){ dragging = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
    else if (e.touches.length === 2){ dragging = false; pinch = touchDist(e); }
  }, { passive:true });
  host.addEventListener('touchmove', function(e){
    if (e.touches.length === 1 && dragging){
      var td = viewDelta(e.touches[0].clientX - lx, e.touches[0].clientY - ly);
      camState.theta -= td.x*0.008;
      camState.phi = clamp(camState.phi - td.y*0.006, 0.12, 1.5);
      lx = e.touches[0].clientX; ly = e.touches[0].clientY;
      e.preventDefault();
    } else if (e.touches.length === 2){
      var d = touchDist(e);
      camState.radius = clamp(camState.radius + (pinch - d)*0.012, 1.4, 22);
      pinch = d; e.preventDefault();
    }
  }, { passive:false });
  host.addEventListener('touchend', function(){ dragging = false; }, { passive:true });
}

function touchDist(e){
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function setCameraMode(mode){
  camState.mode = mode;
  if (mode === 'top'){ camState.phi = 0.2; camState.radius = 8; }
  if (mode === 'orbit'){ camState.phi = 1.05; camState.radius = 6.4; camState.theta = 0.9; }
  if (mode === 'follow'){ camState.phi = 1.0; camState.radius = 3.3; }
}

function onResize(){
  if (!THREE_OK) return;
  var host = $('view3d');
  var w = host.clientWidth || 480, h = host.clientHeight || 320;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}

function animate(now){
  requestAnimationFrame(animate);
  if (!THREE_OK) return;
  var dt = Math.min(0.05, (now - lastFrame)/1000);
  lastFrame = now;
  updateDroneTransform(dt);
  updateGroundGuides();

  if (camState.mode === 'fpv'){
    var yr = sim.yaw*Math.PI/180;
    var fx = -Math.sin(yr), fz = -Math.cos(yr);
    camera.position.set(sim.x*CM + fx*0.16, sim.y*CM + 0.03, sim.z*CM + fz*0.16);
    camera.lookAt(sim.x*CM + fx*4, sim.y*CM + 0.03 - sim.pitch*3, sim.z*CM + fz*4);
  } else {
    if (camState.mode === 'follow'){
      camState.target.x = sim.x*CM; camState.target.y = sim.y*CM + 0.25; camState.target.z = sim.z*CM;
      var yr2 = sim.yaw*Math.PI/180;
      var want = Math.atan2(Math.cos(yr2), Math.sin(yr2));
      var diff = Math.atan2(Math.sin(want - camState.theta), Math.cos(want - camState.theta));
      camState.theta += diff*Math.min(1, dt*2.2);
    } else {
      camState.target.x = 0; camState.target.y = 0.5; camState.target.z = -0.8;
    }
    var k = Math.min(1, dt*4.5);
    camState.curTarget.x += (camState.target.x - camState.curTarget.x)*k;
    camState.curTarget.y += (camState.target.y - camState.curTarget.y)*k;
    camState.curTarget.z += (camState.target.z - camState.curTarget.z)*k;
    var r = camState.radius, p = camState.phi, th = camState.theta;
    camera.position.set(
      camState.curTarget.x + r*Math.sin(p)*Math.cos(th),
      camState.curTarget.y + r*Math.cos(p),
      camState.curTarget.z + r*Math.sin(p)*Math.sin(th)
    );
    camera.lookAt(camState.curTarget.x, camState.curTarget.y, camState.curTarget.z);
  }

  for (var i=0;i<ringMeshes.length;i++) ringMeshes[i].rotation.z += dt*0.35;
  renderer.render(scene, camera);
}

/* -------- ตัวสร้างโปรแกรมตัวอย่างจากสเปก -------- */
function buildBlockFromSpec(spec){
  var b = workspace.newBlock(spec.type);
  if (spec.varName && b.getField('VAR')){
    var v = workspace.getVariable(spec.varName) || workspace.createVariable(spec.varName);
    b.getField('VAR').setValue(v.getId());
  }
  if (spec.fields){
    for (var f in spec.fields) if (b.getField(f)) b.setFieldValue(String(spec.fields[f]), f);
  }
  if (b.initSvg) b.initSvg();
  if (spec.values){
    for (var vn in spec.values){
      var input = b.getInput(vn);
      if (!input || !input.connection) continue;
      var child = buildBlockFromSpec(spec.values[vn]);
      if (child.outputConnection) input.connection.connect(child.outputConnection);
    }
  }
  if (spec.statements){
    for (var sn in spec.statements){
      var sInput = b.getInput(sn);
      if (!sInput || !sInput.connection) continue;
      var first = buildChainFromSpec(spec.statements[sn]);
      if (first && first.previousConnection) sInput.connection.connect(first.previousConnection);
    }
  }
  return b;
}

function buildChainFromSpec(list){
  var first = null, prev = null;
  for (var i=0;i<list.length;i++){
    var b = buildBlockFromSpec(list[i]);
    if (!first) first = b;
    else if (prev && prev.nextConnection && b.previousConnection) prev.nextConnection.connect(b.previousConnection);
    prev = b;
  }
  return first;
}

function loadExample(){
  if (runState.running) return;
  var mission = currentMission;
  if (!mission.example || !mission.example.length){ toast(t('toast.noExample'), 'bad'); return; }
  suppressBlockSound = true;
  workspace.clear();
  seedStart();
  var start = findStartBlock();
  var chain = buildChainFromSpec(mission.example);
  if (start && chain && chain.previousConnection) start.nextConnection.connect(chain.previousConnection);
  workspace.render();
  suppressBlockSound = false;
  setTimeout(function(){ workspace.cleanUp(); refreshPython(); }, 30);

var audioCtx = null;
function getAudioCtx(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, ms, type, gain){
  var ctx = getAudioCtx();
  if (!ctx) return;
  var osc = ctx.createOscillator();
  var g = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  var t0 = ctx.currentTime;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.14, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + ms/1000);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + ms/1000 + 0.02);
}
var UISound = {
  blockPickUp: function(){ beep(880, 70, 'triangle', 0.12); },
  blockDrop:   function(){ beep(660, 90, 'triangle', 0.13); },
  blockDelete: function(){ beep(320, 140, 'sawtooth', 0.11); },
  controlTap:  function(){ beep(520, 60, 'square', 0.09); },
  cameraTap:   function(){ beep(1040, 55, 'sine', 0.10); },
  navTap:      function(){ beep(740, 65, 'sine', 0.10); }
};

var suppressBlockSound = false;
var runState = { running:false, abort:false, paused:false, rate:1, commands:0 };
var curBlock = null;
var currentMission = MISSIONS[0];
var flight = newFlightLog();
var lastTrail = { x:0, y:0, z:0 };
var vars = {};

function newFlightLog(){
  return { tookOff:false, landed:false, errors:0, flips:0, ledUsed:false, crashed:false,
           maxAlt:0, maxDist:0, endDist:0, minFront:9999, rings:[], blocks:[], lowWarned:false };
}

function FlowSignal(kind){ this.kind = kind; }

function scaled(ms){ return Math.max(70, ms / runState.rate); }
function tick(){
  return new Promise(function(r){
    (function wait(){
      if (runState.abort || !runState.paused) return requestAnimationFrame(function(){ r(); });
      requestAnimationFrame(wait);
    })();
  });
}

function tween(ms, fn){
  return new Promise(function(resolve){
    var t0 = performance.now(), last = t0;
    function step(now){
      if (runState.abort) return resolve();
      if (runState.paused){ t0 += (now - last); last = now; requestAnimationFrame(step); return; }
      last = now;
      var p = Math.min(1, (now - t0)/ms);
      fn(easeInOutCubic(p), p);
      updateTelemetry();
      if (p < 1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

function frontDistance(){
  var y = sim.yaw*Math.PI/180;
  return rayObstacleDistance(sim.x, sim.y, sim.z, -Math.sin(y), -Math.cos(y), currentMission.obstacles, 500);
}

function sampleFlight(){
  if (sim.y > flight.maxAlt) flight.maxAlt = sim.y;
  var d = distXZ(sim.x, sim.z);
  if (d > flight.maxDist) flight.maxDist = d;

  if (currentMission.obstacles.length){
    var fd = frontDistance();
    if (sim.flying && fd < flight.minFront) flight.minFront = fd;
    if (!flight.crashed && pointInObstacle(sim.x, sim.y, sim.z, currentMission.obstacles, 12)){
      flight.crashed = true;
      flight.errors++;
      logLine('log.crash', null, 'err');
    }
  }

  if (Math.abs(sim.x-lastTrail.x) + Math.abs(sim.y-lastTrail.y) + Math.abs(sim.z-lastTrail.z) > 1.5){
    lastTrail = { x:sim.x, y:sim.y, z:sim.z };
    addTrailPoint();
  }

  for (var i=0;i<currentMission.rings.length;i++){
    if (flight.rings[i]) continue;
    var r = currentMission.rings[i];
    var dx = sim.x-r.x, dy = sim.y-r.y, dz = sim.z-r.z;
    if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 45){
      flight.rings[i] = true;
      markRingPassed(i);
      logLine('log.ring', [i+1], 'sys');
    }
  }
}

function useBattery(seconds, extra){
  sim.flightTime += seconds;
  sim.battery = clamp(sim.battery - seconds*0.35 - (extra||0), 0, 100);
  if (sim.battery < 20 && !flight.lowWarned){
    flight.lowWarned = true;
    logLine('log.lowbat', null, 'warn');
  }
}

function requireFlying(what){
  if (!sim.flying){
    logLine('log.errNotFlying', [what], 'err');
    flagCurrent(t('log.errNotFlying', [what]));
    flight.errors++;
    return false;
  }
  return true;
}

function localFrame(vec){
  var y = sim.yaw*Math.PI/180;
  var f = { x:-Math.sin(y), z:-Math.cos(y) };
  var r = { x: Math.cos(y), z:-Math.sin(y) };
  return { fwd: vec.x*f.x + vec.z*f.z, right: vec.x*r.x + vec.z*r.z };
}

function moveTo(tx, ty, tz, ms){
  var sx = sim.x, sy = sim.y, sz = sim.z;
  var dxz = Math.sqrt((tx-sx)*(tx-sx) + (tz-sz)*(tz-sz));
  var tilt = dxz > 0.01 ? localFrame({ x:(tx-sx)/dxz, z:(tz-sz)/dxz }) : { fwd:0, right:0 };
  var mag = Math.min(1, dxz/60);
  sim.moving = true;
  useBattery(ms/1000);
  return tween(ms, function(e){
    sim.x = sx + (tx-sx)*e; sim.y = sy + (ty-sy)*e; sim.z = sz + (tz-sz)*e;
    var s = Math.sin(e*Math.PI)*0.3*mag;
    sim.pitch = -tilt.fwd*s; sim.roll = -tilt.right*s;
    sampleFlight();
  }).then(function(){
    if (!runState.abort){ sim.x = tx; sim.y = ty; sim.z = tz; }
    sim.pitch = 0; sim.roll = 0; sim.moving = false;
    sampleFlight();
  });
}

function curveTo(p1, p2, ms){
  var s = { x:sim.x, y:sim.y, z:sim.z };
  sim.moving = true;
  useBattery(ms/1000);
  return tween(ms, function(e){
    var u = 1 - e;
    sim.x = u*u*s.x + 2*u*e*p1.x + e*e*p2.x;
    sim.y = u*u*s.y + 2*u*e*p1.y + e*e*p2.y;
    sim.z = u*u*s.z + 2*u*e*p1.z + e*e*p2.z;
    sim.roll = Math.sin(e*Math.PI)*0.22;
    sampleFlight();
  }).then(function(){
    if (!runState.abort){ sim.x = p2.x; sim.y = p2.y; sim.z = p2.z; }
    sim.roll = 0; sim.moving = false;
    sampleFlight();
  });
}

async function cmdMove(dir, dist){
  if (!requireFlying('fly ' + dir)) return;
  dist = clamp(dist, 20, 500);
  var v = dirVector(dir, sim.yaw);
  var tx = sim.x + v.x*dist, ty = sim.y + v.y*dist, tz = sim.z + v.z*dist;
  if (ty < 20){ logLine('log.warnFloor', null, 'warn'); ty = 20; }
  if (ty > 500){ logLine('log.warnCeiling', null, 'warn'); ty = 500; }
  pushCmd(telloCommand('move', { dir:dir, dist:dist }));
  logLine('log.move', [dir, Math.round(dist), sim.speed], 'ok');
  sim.statusKey = 'status.move';
  await moveTo(tx, ty, tz, scaled(Math.max(0.35, dist/Math.max(10, sim.speed))*1000));
  sim.statusKey = 'status.hover';
}

async function cmdGoto(x, y, z, speed){
  if (!requireFlying('go to')) return;
  y = clamp(y, 20, 500);
  speed = clamp(speed, 10, 100);
  var dx = x - sim.x, dy = y - sim.y, dz = z - sim.z;
  var lf = localFrame({ x:dx, z:dz });
  pushCmd(telloCommand('goto', { x:lf.fwd, y:-lf.right, z:dy, speed:speed }));
  logLine('log.goto', [Math.round(x), Math.round(y), Math.round(z)], 'ok');
  sim.statusKey = 'status.goto';
  var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
  await moveTo(x, y, z, scaled(Math.max(420, dist/speed*1000)));
  sim.statusKey = 'status.hover';
}

async function cmdCurve(x1, y1, z1, x2, y2, z2, speed){
  if (!requireFlying('fly curve')) return;
  speed = clamp(speed, 10, 60);
  var lf1 = localFrame({ x:x1-sim.x, z:z1-sim.z });
  var lf2 = localFrame({ x:x2-sim.x, z:z2-sim.z });
  pushCmd(telloCommand('curve', { x1:lf1.fwd, y1:-lf1.right, z1:y1-sim.y, x2:lf2.fwd, y2:-lf2.right, z2:y2-sim.y, speed:speed }));
  logLine('log.curve', [Math.round(x1), Math.round(y1), Math.round(z1), Math.round(x2), Math.round(y2), Math.round(z2)], 'ok');
  sim.statusKey = 'status.curve';
  var len = Math.sqrt(Math.pow(x2-sim.x,2) + Math.pow(y2-sim.y,2) + Math.pow(z2-sim.z,2)) * 1.3;
  await curveTo({ x:x1, y:clamp(y1,20,500), z:z1 }, { x:x2, y:clamp(y2,20,500), z:z2 }, scaled(Math.max(700, len/speed*1000)));
  sim.statusKey = 'status.hover';
}

async function cmdRotate(way, deg){
  if (!requireFlying('rotate')) return;
  deg = clamp(deg, 1, 360);
  pushCmd(telloCommand('rotate', { way:way, deg:deg }));
  logLine('log.rotate', [way === 'cw' ? 'clockwise' : 'counter-clockwise', Math.round(deg)], 'ok');
  sim.statusKey = 'status.rotate';
  var s = sim.yaw, target = sim.yaw + (way === 'cw' ? -deg : deg);
  useBattery(deg/120);
  await tween(scaled(Math.max(320, deg/90*850)), function(e){
    sim.yaw = s + (target - s)*e;
    sim.roll = (way === 'cw' ? -1 : 1)*Math.sin(e*Math.PI)*0.12;
    sampleFlight();
  });
  if (!runState.abort) sim.yaw = target;
  sim.roll = 0; sim.statusKey = 'status.hover';
}

async function cmdFlip(way){
  if (!requireFlying('flip')) return;
  if (sim.y < 80){
    logLine('log.errFlipLow', [Math.round(sim.y)], 'err');
    flagCurrent(t('log.errFlipLow', [Math.round(sim.y)]));
    flight.errors++;
    return;
  }
  pushCmd(telloCommand('flip', { way:way }));
  logLine('log.flip', [({ f:'forward', b:'back', l:'left', r:'right' })[way] || way], 'ok');
  sim.statusKey = 'status.flip';
  var y0 = sim.y;
  useBattery(1, 1.5);
  await tween(scaled(950), function(e){
    var a = e*Math.PI*2;
    sim.flipPitch = (way === 'f' ? -a : (way === 'b' ? a : 0));
    sim.flipRoll  = (way === 'l' ? a : (way === 'r' ? -a : 0));
    sim.y = y0 + Math.sin(e*Math.PI)*18;
    sampleFlight();
  });
  sim.flipPitch = 0; sim.flipRoll = 0;
  if (!runState.abort) sim.y = y0;
  flight.flips++;
  sim.statusKey = 'status.hover';
}

/* ---------------- การอ่านค่าเซ็นเซอร์ ---------------- */
function sensorValue(name){
  switch(name){
    case 'height':    return Math.round(sim.y);
    case 'battery':   return Math.round(sim.battery);
    case 'time':      return Math.round(sim.flightTime);
    case 'temp':      return Math.round(25 + (100 - sim.battery)*0.15);
    case 'tof':       return Math.round(sim.y + 10);
    case 'yaw':       return Math.round(normDeg(sim.yaw));
    case 'pitch':     return Math.round(sim.pitch*180/Math.PI);
    case 'roll':      return Math.round(sim.roll*180/Math.PI);
    case 'speed':     return Math.round(sim.speed);
    case 'pos_x':     return Math.round(sim.x);
    case 'pos_y':     return Math.round(sim.y);
    case 'pos_z':     return Math.round(sim.z);
    case 'dist_home': return Math.round(distXZ(sim.x, sim.z));
    case 'front':     return Math.round(frontDistance());
    default:          return 0;
  }
}

/* ---------------- การประเมินค่าในบล็อกนิพจน์ ---------------- */
function varNameOf(b){
  var f = b.getField('VAR');
  if (!f) return 'item';
  if (f.getVariable){ var v = f.getVariable(); if (v && v.name) return v.name; }
  if (f.getText) return f.getText();
  return String(b.getFieldValue('VAR'));
}

function numOf(v, def){ var n = Number(v); return isNaN(n) ? (def || 0) : n; }

function evalValue(b, def){
  if (!b) return def;
  var a, c;
  switch(b.type){
    case 'math_number': return numOf(b.getFieldValue('NUM'), 0);
    case 'math_arithmetic': {
      a = numOf(evalValue(b.getInputTargetBlock('A'), 0), 0);
      c = numOf(evalValue(b.getInputTargetBlock('B'), 0), 0);
      switch(b.getFieldValue('OP')){
        case 'ADD': return a + c;
        case 'MINUS': return a - c;
        case 'MULTIPLY': return a * c;
        case 'DIVIDE': return c === 0 ? 0 : a / c;
        case 'POWER': return Math.pow(a, c);
      }
      return 0;
    }
    case 'math_single': {
      a = numOf(evalValue(b.getInputTargetBlock('NUM'), 0), 0);
      switch(b.getFieldValue('OP')){
        case 'ROOT': return Math.sqrt(Math.abs(a));
        case 'ABS': return Math.abs(a);
        case 'NEG': return -a;
        case 'LN': return a > 0 ? Math.log(a) : 0;
        case 'LOG10': return a > 0 ? Math.log(a)/Math.LN10 : 0;
        case 'EXP': return Math.exp(a);
        case 'POW10': return Math.pow(10, a);
      }
      return a;
    }
    case 'math_round': {
      a = numOf(evalValue(b.getInputTargetBlock('NUM'), 0), 0);
      var op = b.getFieldValue('OP');
      return op === 'ROUNDUP' ? Math.ceil(a) : (op === 'ROUNDDOWN' ? Math.floor(a) : Math.round(a));
    }
    case 'math_modulo': {
      a = numOf(evalValue(b.getInputTargetBlock('DIVIDEND'), 0), 0);
      c = numOf(evalValue(b.getInputTargetBlock('DIVISOR'), 1), 1);
      return c === 0 ? 0 : a % c;
    }
    case 'math_random_int': {
      a = Math.round(numOf(evalValue(b.getInputTargetBlock('FROM'), 0), 0));
      c = Math.round(numOf(evalValue(b.getInputTargetBlock('TO'), 1), 1));
      if (a > c){ var tmp = a; a = c; c = tmp; }
      return a + Math.floor(Math.random()*(c - a + 1));
    }
    case 'logic_boolean': return b.getFieldValue('BOOL') === 'TRUE';
    case 'logic_negate':  return !evalValue(b.getInputTargetBlock('BOOL'), false);
    case 'logic_operation': {
      var la = evalValue(b.getInputTargetBlock('A'), false);
      var lb = evalValue(b.getInputTargetBlock('B'), false);
      return b.getFieldValue('OP') === 'AND' ? (!!la && !!lb) : (!!la || !!lb);
    }
    case 'logic_compare': {
      a = evalValue(b.getInputTargetBlock('A'), 0);
      c = evalValue(b.getInputTargetBlock('B'), 0);
      switch(b.getFieldValue('OP')){
        case 'EQ':  return a === c || Number(a) === Number(c);
        case 'NEQ': return !(a === c || Number(a) === Number(c));
        case 'LT':  return Number(a) < Number(c);
        case 'LTE': return Number(a) <= Number(c);
        case 'GT':  return Number(a) > Number(c);
        case 'GTE': return Number(a) >= Number(c);
      }
      return false;
    }
    case 'text': return b.getFieldValue('TEXT');
    case 'text_join': {
      var out = '', i = 0;
      while (b.getInput('ADD' + i)){ out += String(evalValue(b.getInputTargetBlock('ADD' + i), '')); i++; }
      return out;
    }
    case 'variables_get': {
      var vn = varNameOf(b);
      return (vn in vars) ? vars[vn] : 0;
    }
    case 'drone_get': return sensorValue(b.getFieldValue('SENSOR'));
    case 'drone_is_flying': return !!sim.flying;
    case 'drone_obstacle_ahead': {
      var lim = numOf(evalValue(b.getInputTargetBlock('DIST'), 100), 100);
      return frontDistance() < lim;
    }
    case 'drone_battery_low': return sim.battery < 20;
    case 'procedures_callreturn': {
      var pd = findProcDef(b.getFieldValue('NAME'));
      if (!pd) return def;
      var pnames = pd.getVars ? pd.getVars() : [];
      for (var pi=0; pi<pnames.length; pi++){
        if (b.getInput('ARG' + pi)) vars[pnames[pi]] = evalValue(b.getInputTargetBlock('ARG' + pi), 0);
      }
      return evalValue(pd.getInputTargetBlock('RETURN'), def);
    }
    default:
      return def;
  }
}

/* ---------------- การทำงานของบล็อกคำสั่ง ---------------- */
async function runLoopBody(inner){
  try { await execChain(inner); }
  catch(e){
    if (e instanceof FlowSignal) return e.kind;
    throw e;
  }
  return 'OK';
}

async function execBlock(b, depth){
  if (runState.abort || !b) return;
  if (b.isEnabled && !b.isEnabled()) return;
  if (++runState.commands > CMD_LIMIT){ logLine('log.limit', [CMD_LIMIT], 'warn'); runState.abort = true; return; }
  curBlock = b;
  try { workspace.highlightBlock(b.id); } catch(e){}
  flight.blocks.push(b.type);
  var i, n, inner, res;

  switch(b.type){
    case 'drone_takeoff':   await cmdTakeoff(); break;
    case 'drone_land':      await cmdLand(); break;
    case 'drone_emergency': await cmdEmergency(); break;
    case 'drone_stop':      await cmdStop(); break;
    case 'drone_hover':     await cmdHover(numOf(b.getFieldValue('SEC'), 2)); break;
    case 'drone_speed':     cmdSpeed(numOf(b.getFieldValue('VALUE'), 50)); break;
    case 'drone_move':      await cmdMove(b.getFieldValue('DIR'), numOf(b.getFieldValue('DIST'), 100)); break;
    case 'drone_move_by':   await cmdMove(b.getFieldValue('DIR'), numOf(evalValue(b.getInputTargetBlock('DISTANCE'), 50), 50)); break;
    case 'drone_goto':      await cmdGoto(numOf(b.getFieldValue('X'), 0), numOf(b.getFieldValue('Y'), 100), numOf(b.getFieldValue('Z'), 0), numOf(b.getFieldValue('SPEED'), 60)); break;
    case 'drone_curve':     await cmdCurve(numOf(b.getFieldValue('X1'),0), numOf(b.getFieldValue('Y1'),100), numOf(b.getFieldValue('Z1'),0),
                                           numOf(b.getFieldValue('X2'),0), numOf(b.getFieldValue('Y2'),100), numOf(b.getFieldValue('Z2'),0),
                                           numOf(b.getFieldValue('SPEED'),60)); break;
    case 'drone_rotate':    await cmdRotate(b.getFieldValue('WAY'), numOf(b.getFieldValue('DEG'), 90)); break;
    case 'drone_rotate_by': await cmdRotate(b.getFieldValue('WAY'), numOf(evalValue(b.getInputTargetBlock('DEGREES'), 90), 90)); break;
    case 'drone_flip':      await cmdFlip(b.getFieldValue('WAY')); break;
    case 'drone_flip_random': {
      var flipWays = ['f','b','l','r'];
      await cmdFlip(flipWays[Math.floor(Math.random()*flipWays.length)]);
      break;
    }
    case 'drone_go_home':   await cmdGoHome(); break;
    case 'drone_led':       cmdLed(b.getFieldValue('COLOR')); break;
    case 'drone_led_blink': await cmdLedBlink(b.getFieldValue('COLOR'), numOf(b.getFieldValue('TIMES'), 3)); break;
    case 'drone_led_rgb':   cmdLedRGB(numOf(evalValue(b.getInputTargetBlock('R'), 0), 0),
                                      numOf(evalValue(b.getInputTargetBlock('G'), 0), 0),
                                      numOf(evalValue(b.getInputTargetBlock('B'), 0), 0)); break;
    case 'drone_print':     logLine('log.print', [String(evalValue(b.getInputTargetBlock('TEXT'), ''))], 'sys'); break;
    case 'drone_wait_until': await cmdWaitUntil(b); break;

    case 'controls_if': {
      n = 0;
      var done = false;
      while (b.getInput('IF' + n)){
        if (evalValue(b.getInputTargetBlock('IF' + n), false)){
          await execChain(b.getInputTargetBlock('DO' + n), depth);
          done = true;
          break;
        }
        n++;
      }
      if (!done && b.getInput('ELSE')) await execChain(b.getInputTargetBlock('ELSE'), depth);
      break;
    }

    case 'controls_repeat_ext': {
      n = clamp(Math.floor(numOf(evalValue(b.getInputTargetBlock('TIMES'), 1), 1)), 0, LOOP_LIMIT);
      inner = b.getInputTargetBlock('DO');
      if (!inner){ logLine('log.loopEmpty', null, 'warn'); break; }
      logLine('log.loop', [n], 'sys');
      for (i=0;i<n;i++){
        if (runState.abort) return;
        res = await runLoopBody(inner);
        if (res === 'BREAK') break;
        await tick();
      }
      break;
    }

    case 'controls_whileUntil': {
      var untilMode = b.getFieldValue('MODE') === 'UNTIL';
      inner = b.getInputTargetBlock('DO');
      var guard = 0;
      while (!runState.abort){
        var cond = !!evalValue(b.getInputTargetBlock('BOOL'), false);
        if (untilMode) cond = !cond;
        if (!cond) break;
        if (++guard > LOOP_LIMIT){ logLine('log.limit', [LOOP_LIMIT], 'warn'); break; }
        res = await runLoopBody(inner);
        if (res === 'BREAK') break;
        await tick();
      }
      break;
    }

    case 'controls_for': {
      var vname = varNameOf(b);
      var from = numOf(evalValue(b.getInputTargetBlock('FROM'), 1), 1);
      var to   = numOf(evalValue(b.getInputTargetBlock('TO'), 1), 1);
      var by   = Math.abs(numOf(evalValue(b.getInputTargetBlock('BY'), 1), 1)) || 1;
      inner = b.getInputTargetBlock('DO');
      var count = 0, x;
      if (from <= to){
        for (x = from; x <= to; x += by){
          if (runState.abort || ++count > LOOP_LIMIT) break;
          vars[vname] = x;
          res = await runLoopBody(inner);
          if (res === 'BREAK') break;
          await tick();
        }
      } else {
        for (x = from; x >= to; x -= by){
          if (runState.abort || ++count > LOOP_LIMIT) break;
          vars[vname] = x;
          res = await runLoopBody(inner);
          if (res === 'BREAK') break;
          await tick();
        }
      }
      break;
    }

    case 'controls_flow_statements':
      throw new FlowSignal(b.getFieldValue('FLOW') === 'CONTINUE' ? 'CONTINUE' : 'BREAK');

    case 'variables_set': {
      var sn = varNameOf(b);
      vars[sn] = evalValue(b.getInputTargetBlock('VALUE'), 0);
      logLine('log.varSet', [sn, String(vars[sn])], 'sys');
      break;
    }

    case 'math_change': {
      var cn = varNameOf(b);
      vars[cn] = numOf(vars[cn], 0) + numOf(evalValue(b.getInputTargetBlock('DELTA'), 1), 1);
      logLine('log.varSet', [cn, String(vars[cn])], 'sys');
      break;
    }

    case 'procedures_callnoreturn': {
      var pname = b.getFieldValue('NAME');
      var def = findProcDef(pname);
      if (!def){ logLine('log.procMissing', [pname], 'warn'); break; }
      if ((depth || 0) >= PROC_DEPTH) break;
      var argNames = def.getVars ? def.getVars() : [];
      for (i=0;i<argNames.length;i++){
        var av = b.getInput('ARG' + i);
        if (av) vars[argNames[i]] = evalValue(b.getInputTargetBlock('ARG' + i), 0);
      }
      logLine('log.callProc', [pname], 'sys');
      await execChain(def.getInputTargetBlock('STACK'), (depth || 0) + 1);
      break;
    }

    case 'procedures_defnoreturn':
    case 'procedures_defreturn':
      break;

    default:
      logLine('log.unknown', [b.type], 'warn');
  }
}

async function execChain(block, depth){
  while (block){
    if (runState.abort) return;
    await execBlock(block, depth || 0);
    block = block.getNextBlock();
  }
}

function findProcDef(name){
  var tops = workspace.getTopBlocks(false);
  for (var i=0;i<tops.length;i++){
    if ((tops[i].type === 'procedures_defnoreturn' || tops[i].type === 'procedures_defreturn') &&
        tops[i].getFieldValue('NAME') === name) return tops[i];
  }
  return null;
}

   ส่วนที่ 5 : ตัวสร้างโค้ด Python (djitellopy)
   ===================================================================== */

function pyIndent(n){ var s = ''; for (var i=0;i<n;i++) s += '    '; return s; }
function pyStr(v){ return '"' + String(v).replace(/"/g, '\\"') + '"'; }

function pyValue(b){
  if (!b) return '0';
  var a, c;
  switch(b.type){
    case 'math_number': return String(numOf(b.getFieldValue('NUM'), 0));
    case 'math_arithmetic': {
      a = pyValue(b.getInputTargetBlock('A')); c = pyValue(b.getInputTargetBlock('B'));
      var ops = { ADD:'+', MINUS:'-', MULTIPLY:'*', DIVIDE:'/', POWER:'**' };
      return '(' + a + ' ' + (ops[b.getFieldValue('OP')] || '+') + ' ' + c + ')';
    }
    case 'math_single': {
      a = pyValue(b.getInputTargetBlock('NUM'));
      switch(b.getFieldValue('OP')){
        case 'ROOT': return 'math.sqrt(' + a + ')';
        case 'ABS': return 'abs(' + a + ')';
        case 'NEG': return '(-' + a + ')';
        case 'LN': return 'math.log(' + a + ')';
        case 'LOG10': return 'math.log10(' + a + ')';
        case 'EXP': return 'math.exp(' + a + ')';
        case 'POW10': return '(10 ** ' + a + ')';
      }
      return a;
    }
    case 'math_round': {
      a = pyValue(b.getInputTargetBlock('NUM'));
      var op = b.getFieldValue('OP');
      return op === 'ROUNDUP' ? 'math.ceil(' + a + ')' : (op === 'ROUNDDOWN' ? 'math.floor(' + a + ')' : 'round(' + a + ')');
    }
    case 'math_modulo': return '(' + pyValue(b.getInputTargetBlock('DIVIDEND')) + ' % ' + pyValue(b.getInputTargetBlock('DIVISOR')) + ')';
    case 'math_random_int': return 'random.randint(' + pyValue(b.getInputTargetBlock('FROM')) + ', ' + pyValue(b.getInputTargetBlock('TO')) + ')';
    case 'logic_boolean': return b.getFieldValue('BOOL') === 'TRUE' ? 'True' : 'False';
    case 'logic_negate': return 'not (' + pyValue(b.getInputTargetBlock('BOOL')) + ')';
    case 'logic_operation': return '(' + pyValue(b.getInputTargetBlock('A')) + (b.getFieldValue('OP') === 'AND' ? ' and ' : ' or ') + pyValue(b.getInputTargetBlock('B')) + ')';
    case 'logic_compare': {
      var cops = { EQ:'==', NEQ:'!=', LT:'<', LTE:'<=', GT:'>', GTE:'>=' };
      return '(' + pyValue(b.getInputTargetBlock('A')) + ' ' + (cops[b.getFieldValue('OP')] || '==') + ' ' + pyValue(b.getInputTargetBlock('B')) + ')';
    }
    case 'text': return pyStr(b.getFieldValue('TEXT'));
    case 'text_join': {
      var parts = [], i = 0;
      while (b.getInput('ADD' + i)){ parts.push('str(' + pyValue(b.getInputTargetBlock('ADD' + i)) + ')'); i++; }
      return parts.length ? parts.join(' + ') : pyStr('');
    }
    case 'variables_get': return varNameOf(b);
    case 'drone_get': return PY_SENSOR[b.getFieldValue('SENSOR')] || '0';
    case 'drone_is_flying': return 'tello.is_flying';
    case 'drone_obstacle_ahead': return '(front_distance() < ' + pyValue(b.getInputTargetBlock('DIST')) + ')';
    case 'drone_battery_low': return '(tello.get_battery() < 20)';
    case 'procedures_callreturn': {
      var cargs = [], ci = 0;
      while (b.getInput('ARG' + ci)){ cargs.push(pyValue(b.getInputTargetBlock('ARG' + ci))); ci++; }
      return safePyName(b.getFieldValue('NAME')) + '(' + cargs.join(', ') + ')';
    }
    default: return '0';
  }
}

function pyStatement(b, ind){
  var L = [], p = pyIndent(ind), i, n;
  switch(b.type){
    case 'drone_takeoff':   L.push(p + pyCommand('takeoff')); break;
    case 'drone_land':      L.push(p + pyCommand('land')); break;
    case 'drone_emergency': L.push(p + pyCommand('emergency')); break;
    case 'drone_stop':      L.push(p + pyCommand('stop')); break;
    case 'drone_hover':     L.push(p + pyCommand('hover', { sec:numOf(b.getFieldValue('SEC'), 2) })); break;
    case 'drone_speed':     L.push(p + pyCommand('speed', { value:numOf(b.getFieldValue('VALUE'), 50) })); break;
    case 'drone_move':      L.push(p + pyCommand('move', { dir:b.getFieldValue('DIR'), dist:numOf(b.getFieldValue('DIST'), 100) })); break;
    case 'drone_move_by':   L.push(p + 'tello.move_' + b.getFieldValue('DIR') + '(int(' + pyValue(b.getInputTargetBlock('DISTANCE')) + '))'); break;
    case 'drone_goto':      L.push(p + pyCommand('goto', { x:numOf(b.getFieldValue('X'),0), y:numOf(b.getFieldValue('Y'),100), z:numOf(b.getFieldValue('Z'),0), speed:numOf(b.getFieldValue('SPEED'),60) })); break;
    case 'drone_curve':     L.push(p + pyCommand('curve', { x1:numOf(b.getFieldValue('X1'),0), y1:numOf(b.getFieldValue('Y1'),0), z1:numOf(b.getFieldValue('Z1'),0),
                                                            x2:numOf(b.getFieldValue('X2'),0), y2:numOf(b.getFieldValue('Y2'),0), z2:numOf(b.getFieldValue('Z2'),0),
                                                            speed:numOf(b.getFieldValue('SPEED'),60) })); break;
    case 'drone_rotate':    L.push(p + pyCommand('rotate', { way:b.getFieldValue('WAY'), deg:numOf(b.getFieldValue('DEG'), 90) })); break;
    case 'drone_rotate_by': L.push(p + 'tello.rotate_' + (b.getFieldValue('WAY') === 'cw' ? 'clockwise' : 'counter_clockwise') + '(int(' + pyValue(b.getInputTargetBlock('DEGREES')) + '))'); break;
    case 'drone_flip':      L.push(p + pyCommand('flip', { way:b.getFieldValue('WAY') })); break;
    case 'drone_flip_random':
      L.push(p + 'getattr(tello, "flip_" + random.choice(["forward","back","left","right"]))()');
      break;
    case 'drone_go_home':
      L.push(p + 'tello.go_xyz_speed(-position_x, 0, -position_z, 60)');
      break;
    case 'drone_led':       L.push(p + pyCommand('led', { color:b.getFieldValue('COLOR') })); break;
    case 'drone_led_blink': {
      var blinkN = numOf(b.getFieldValue('TIMES'), 3);
      var blinkColor = b.getFieldValue('COLOR');
      L.push(p + 'for _ in range(' + blinkN + '):');
      L.push(pyIndent(ind+1) + pyCommand('led', { color:blinkColor }));
      L.push(pyIndent(ind+1) + 'time.sleep(0.18)');
      L.push(pyIndent(ind+1) + pyCommand('led', { color:'off' }));
      L.push(pyIndent(ind+1) + 'time.sleep(0.14)');
      break;
    }
    case 'drone_led_rgb':   L.push(p + 'tello.send_expansion_command("led %d %d %d" % (' + pyValue(b.getInputTargetBlock('R')) + ', ' + pyValue(b.getInputTargetBlock('G')) + ', ' + pyValue(b.getInputTargetBlock('B')) + '))'); break;
    case 'drone_print':     L.push(p + 'print(' + pyValue(b.getInputTargetBlock('TEXT')) + ')'); break;
    case 'drone_wait_until':
      L.push(p + 'while not (' + pyValue(b.getInputTargetBlock('COND')) + '):');
      L.push(pyIndent(ind+1) + 'time.sleep(0.1)');
      break;

    case 'controls_if': {
      n = 0;
      while (b.getInput('IF' + n)){
        L.push(p + (n === 0 ? 'if ' : 'elif ') + pyValue(b.getInputTargetBlock('IF' + n)) + ':');
        L = L.concat(pyChain(b.getInputTargetBlock('DO' + n), ind + 1, true));
        n++;
      }
      if (b.getInput('ELSE')){
        L.push(p + 'else:');
        L = L.concat(pyChain(b.getInputTargetBlock('ELSE'), ind + 1, true));
      }
      break;
    }
    case 'controls_repeat_ext':
      L.push(p + 'for _ in range(int(' + pyValue(b.getInputTargetBlock('TIMES')) + ')):');
      L = L.concat(pyChain(b.getInputTargetBlock('DO'), ind + 1, true));
      break;
    case 'controls_whileUntil':
      L.push(p + 'while ' + (b.getFieldValue('MODE') === 'UNTIL' ? 'not (' + pyValue(b.getInputTargetBlock('BOOL')) + ')' : pyValue(b.getInputTargetBlock('BOOL'))) + ':');
      L = L.concat(pyChain(b.getInputTargetBlock('DO'), ind + 1, true));
      break;
    case 'controls_for':
      L.push(p + 'for ' + varNameOf(b) + ' in range(int(' + pyValue(b.getInputTargetBlock('FROM')) + '), int(' + pyValue(b.getInputTargetBlock('TO')) + ') + 1, int(' + pyValue(b.getInputTargetBlock('BY')) + ')):');
      L = L.concat(pyChain(b.getInputTargetBlock('DO'), ind + 1, true));
      break;
    case 'controls_flow_statements':
      L.push(p + (b.getFieldValue('FLOW') === 'CONTINUE' ? 'continue' : 'break'));
      break;
    case 'variables_set':
      L.push(p + varNameOf(b) + ' = ' + pyValue(b.getInputTargetBlock('VALUE')));
      break;
    case 'math_change':
      L.push(p + varNameOf(b) + ' = ' + varNameOf(b) + ' + ' + pyValue(b.getInputTargetBlock('DELTA')));
      break;
    case 'procedures_callnoreturn': {
      var args = [], k = 0;
      while (b.getInput('ARG' + k)){ args.push(pyValue(b.getInputTargetBlock('ARG' + k))); k++; }
      L.push(p + safePyName(b.getFieldValue('NAME')) + '(' + args.join(', ') + ')');
      break;
    }
    default:
      L.push(p + '# ' + b.type);
  }
  return L;
}

function safePyName(name){
  var s = String(name || 'my_function').trim().replace(/[^A-Za-z0-9_]/g, '_');
  if (!/^[A-Za-z_]/.test(s)) s = 'f_' + s;
  return s.toLowerCase();
}

function pyChain(block, ind, allowPass){
  var L = [];
  while (block){
    if (!block.isEnabled || block.isEnabled()) L = L.concat(pyStatement(block, ind));
    block = block.getNextBlock();
  }
  if (!L.length && allowPass) L.push(pyIndent(ind) + 'pass');
  return L;
}

function genPython(){
  var L = ['# DroneCode Lab - generated Python for djitellopy',
           '# ' + (LANG === 'th' ? 'ภารกิจ' : 'mission') + ': ' + currentMission.name.en,
           'from djitellopy import Tello',
           'import time, math, random',
           '',
           'tello = Tello()',
           'tello.connect()',
           'print("battery:", tello.get_battery())',
           ''];
  if (!workspace) return L;

  var tops = workspace.getTopBlocks(true), i;
  for (i=0;i<tops.length;i++){
    if (tops[i].type === 'procedures_defnoreturn' || tops[i].type === 'procedures_defreturn'){
      var argNames = (tops[i].getVars ? tops[i].getVars() : []).map(safePyName);
      L.push('def ' + safePyName(tops[i].getFieldValue('NAME')) + '(' + argNames.join(', ') + '):');
      var body = pyChain(tops[i].getInputTargetBlock('STACK'), 1, false);
      if (tops[i].type === 'procedures_defreturn'){
        body.push(pyIndent(1) + 'return ' + pyValue(tops[i].getInputTargetBlock('RETURN')));
      }
      if (!body.length) body.push(pyIndent(1) + 'pass');
      L = L.concat(body);
      L.push('');
    }
  }

  var start = findStartBlock();
  var first = start ? start.getNextBlock() : null;
  if (!first){
    L.push('# ' + (LANG === 'th' ? 'ยังไม่มีคำสั่งในบล็อก when program starts' : 'no blocks under "when program starts" yet'));
  } else {
    L = L.concat(pyChain(first, 0, false));
  }
  L.push('');
  L.push('tello.end()');
  return L;
}

var pyTimer = null;
function refreshPython(){
  clearTimeout(pyTimer);
  pyTimer = setTimeout(function(){
    pyLines = genPython();
    if (activeTab === 'py') renderConsole();
  }, 120);
}

function seedStart(){
  try{
    var b = workspace.newBlock('drone_start');
    if (b.initSvg) b.initSvg();

    workspace.render();
  }catch(e){}
}

function findStartBlock(){
  if (!workspace) return null;
  var tops = workspace.getTopBlocks(true);
  for (var i=0;i<tops.length;i++) if (tops[i].type === 'drone_start') return tops[i];

}

function updateTelemetry(){
  $('tX').textContent = Math.round(sim.x);
  $('tY').textContent = Math.round(sim.y);
  $('tZ').textContent = Math.round(sim.z);
  $('tSpeed').textContent = Math.round(sim.speed);
  $('tLed').textContent = sim.led;
  $('tBat').textContent = Math.round(sim.battery) + '%';
  $('tTime').textContent = Math.round(sim.flightTime) + 's';
  $('hudAlt').textContent = Math.round(sim.y) + ' cm';
  $('hudYaw').textContent = Math.round(normDeg(sim.yaw)) + ' deg';
  $('hudStatus').textContent = t(sim.statusKey);
  $('hudFront').textContent = currentMission.obstacles.length ? (Math.round(frontDistance()) + ' cm') : '--';
  var got = flight.rings.filter(function(v){ return v; }).length;
  $('hudRings').textContent = got + '/' + currentMission.rings.length;
  $('sheetPeek').textContent = Math.round(sim.y) + ' cm  ' + Math.round(sim.battery) + '%';
}

function setRunUI(running){
  $('btnRun').disabled = running;
  $('btnStop').disabled = !running;
  $('btnPause').disabled = !running;
  $('btnReset').disabled = running;
  $('missionSelect').disabled = running;
  $('btnExample').disabled = running;
  $('pauseLabel').textContent = t(runState.paused ? 'btn.resume' : 'btn.pause');
}

function resetDrone(quiet){
  sim.x = 0; sim.y = 0; sim.z = 0; sim.yaw = 0; sim.speed = 50;
  sim.led = 'off'; sim.ledRGBv = [0,0,0]; sim.flying = false;
  sim.battery = 100; sim.flightTime = 0;
  sim.pitch = 0; sim.roll = 0; sim.flipPitch = 0; sim.flipRoll = 0;
  sim.moving = false; sim.statusKey = 'status.ready';
  flight = newFlightLog();
  vars = {};
  lastTrail = { x:0, y:0, z:0 };
  clearTrail(); resetRingVisual(); updateLEDVisual(); updateDroneTransform(0); updateTelemetry();
  if (!quiet) logLine('log.reset', null, 'sys');
}

async function onRun(){
  if (runState.running || !workspace) return;
  var start = findStartBlock();
  var first = start ? start.getNextBlock() : null;
  if (!first){ toast(t('toast.noProgram'), 'bad'); return; }

  resetDrone(true);
  clearWarnings();
  cmdLines = [];
  runState.running = true; runState.abort = false; runState.paused = false; runState.commands = 0;
  runState.rate = Number($('speedSelect').value) || 1;
  setRunUI(true);
  setBadge('badge.flying', '');
  logLine('log.start', [currentMission.name[LANG] || currentMission.name.en], 'sys');

  try { await execChain(first, 0); }
  catch(err){
    if (!(err instanceof FlowSignal)) logLine('log.unknown', [String(err && err.message || err)], 'err');
  }

  try { workspace.highlightBlock(null); } catch(e){}
  curBlock = null;
  runState.running = false; runState.paused = false;
  setRunUI(false);
  if (flight.errors > 0) logLine('log.blockWarn', null, 'warn');

  if (runState.abort){
    sim.statusKey = 'status.stopped';
    updateTelemetry();

function bindSplitHandles(){
  var layout = $('layout');
  var lessonHandle = document.querySelector('[data-handle="lesson-code"]');
  var codeHandle = document.querySelector('[data-handle="code-arena"]');
  if (!lessonHandle || !codeHandle) return;

  function px(v){ return Math.round(v) + 'px'; }

  function bind(handle, onMove){
    var dragging = false, startX = 0, startVal = null;
    function down(x){
      dragging = true; startX = x; handle.classList.add('active');
      var cs = getComputedStyle(layout);
      startVal = { lessonW: parseFloat(cs.getPropertyValue('--lesson-w')) || 320,
                   codeFr: parseFloat(cs.getPropertyValue('--code-fr')) || 0.5,
                   layoutW: layout.getBoundingClientRect().width };
    }
    function move(x){
      if (!dragging) return;
      onMove(x - startX, startVal);
    }
    function up(){
      if (!dragging) return;
      dragging = false; handle.classList.remove('active');
      refit();
    }
    handle.addEventListener('mousedown', function(e){ down(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', function(e){ move(e.clientX); });
    window.addEventListener('mouseup', up);
    handle.addEventListener('touchstart', function(e){ down(e.touches[0].clientX); }, { passive:true });
    handle.addEventListener('touchmove', function(e){ move(e.touches[0].clientX); e.preventDefault(); }, { passive:false });
    handle.addEventListener('touchend', up, { passive:true });
  }

  bind(lessonHandle, function(dx, start){
    var minW = 230, maxW = Math.max(231, start.layoutW * 0.42);
    var next = clamp(start.lessonW + dx, minW, maxW);
    layout.style.setProperty('--lesson-w', px(next));
  });

  bind(codeHandle, function(dx, start){
    var lessonW = document.body.classList.contains('mode-wide') ? start.lessonW : 0;
    var handles = document.body.classList.contains('mode-wide') ? 28 : 14;
    var rest = start.layoutW - lessonW - handles;
    var startCodePx = rest * start.codeFr;
    var nextPx = clamp(startCodePx + dx, rest * 0.25, rest * 0.75);
    var frac = rest > 0 ? nextPx / rest : 0.5;
    layout.style.setProperty('--code-fr', frac + 'fr');
    layout.style.setProperty('--arena-fr', (1 - frac) + 'fr');
  });
}

async function toggleLandscape(){

    if (!document.fullscreenElement && document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();

    if (window.screen && screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape');

}

var sheetState = 'closed';

function setSheet(state){
  sheetState = state;
  var el = $('dataSheet');
  el.style.transition = '';
  el.style.transform = '';
  el.setAttribute('data-state', state);
  $('sheetChevron').style.transform = (state === 'open') ? 'rotate(180deg)' : '';
}

function cycleSheet(){
  setSheet(sheetState === 'closed' ? 'peek' : (sheetState === 'peek' ? 'open' : 'closed'));
}

function sheetOffsetOf(state, h){
  if (state === 'open') return 0;
  if (state === 'peek') return Math.max(0, h - 158);
  return Math.max(0, h - 46);
}

function sheetAxis(x, y){ return rotatedMode ? -x : y; }

function bindSheet(){
  var el = $('dataSheet'), handle = $('sheetHandle');
  var dragging = false, startPos = 0, startOff = 0, moved = 0, height = 0, lastOff = 0;

  function down(pos){
    dragging = true; moved = 0; startPos = pos;
    height = el.offsetHeight || 240;
    startOff = sheetOffsetOf(sheetState, height);
    lastOff = startOff;
    el.style.transition = 'none';
  }
  function move(pos){
    if (!dragging) return;
    var d = pos - startPos;
    if (Math.abs(d) > moved) moved = Math.abs(d);
    lastOff = clamp(startOff + d, 0, sheetOffsetOf('closed', height));
    el.style.transform = 'translateY(' + lastOff + 'px)';
  }
  function up(){
    if (!dragging) return;
    dragging = false;
    el.style.transition = '';
    if (moved < 6){ cycleSheet(); return; }
    var states = ['open','peek','closed'], best = states[0], bestD = Infinity;
    for (var i=0;i<states.length;i++){
      var d = Math.abs(sheetOffsetOf(states[i], height) - lastOff);
      if (d < bestD){ bestD = d; best = states[i]; }
    }
    setSheet(best);
  }

  handle.addEventListener('mousedown', function(e){ down(sheetAxis(e.clientX, e.clientY)); e.preventDefault(); });
  window.addEventListener('mousemove', function(e){ move(sheetAxis(e.clientX, e.clientY)); });
  window.addEventListener('mouseup', function(){ up(); });
  handle.addEventListener('touchstart', function(e){ down(sheetAxis(e.touches[0].clientX, e.touches[0].clientY)); }, { passive:true });
  handle.addEventListener('touchmove', function(e){ move(sheetAxis(e.touches[0].clientX, e.touches[0].clientY)); e.preventDefault(); }, { passive:false });
  handle.addEventListener('touchend', function(){ up(); }, { passive:true });
}

function loadProject(file){

      var obj = JSON.parse(reader.result);
      if (obj.mission){ $('missionSelect').value = obj.mission; applyMission(obj.mission); }
      workspace.clear();
      if (obj.workspace && obj.workspace.xml){
        var toDom = (Blockly.utils && Blockly.utils.xml && Blockly.utils.xml.textToDom) ? Blockly.utils.xml.textToDom : Blockly.Xml.textToDom;
        Blockly.Xml.domToWorkspace(toDom(obj.workspace.xml), workspace);
      } else {
        Blockly.serialization.workspaces.load(obj.workspace, workspace);
      }
      if (!findStartBlock()) seedStart();
      var sb = findStartBlock();
      if (sb) sb.setDeletable(false);
      suppressBlockSound = false;
      refreshPython();
      toast(t('toast.loaded'), 'good');
    }catch(e){ suppressBlockSound = false; toast(t('toast.loadErr', [e.message]), 'bad'); }
  };
  reader.readAsText(file);
}

    THREE_OK = initThree();
  } catch(e){ THREE_OK = false; }
  if (!THREE_OK) showViewFallback();

  setOverlay('overlay.setup', null);
  try { initBlockly(); }
  catch(e){ overlayError('overlay.errInject', null); return; }

  wireUI();
  bindSplitHandles();
  applyResponsive();
  setSheet('closed');
  if (screenWidth() >= 1180) toggleHud();
  setView(currentView);
  setLessonTab('lesson');
  applyMission(MISSIONS[0].id);
  applyLang();
  logLine('log.ready', null, 'sys');
  hideOverlay();
}

/* ---------- เส้นนำสายตาบนพื้น เพื่อให้เห็นชัดว่าโดรนอยู่ตรงไหนและหันไปทางใด ---------- */
var groundMarker, dropLine, dropPos;

function buildGroundGuides(){
  groundMarker = new THREE.Group();
  var ring = new THREE.Mesh(
    new THREE.RingGeometry(0.15, 0.185, 40),
    new THREE.MeshBasicMaterial({ color:0x0071e3, transparent:true, opacity:0.6, side:THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2;
  groundMarker.add(ring);
  var arrow = new THREE.Mesh(
    new THREE.ConeGeometry(0.07, 0.15, 3),
    new THREE.MeshBasicMaterial({ color:0xff3b30, transparent:true, opacity:0.85 })
  );
  arrow.rotation.x = -Math.PI/2;
  arrow.position.set(0, 0, -0.3);
  groundMarker.add(arrow);
  groundMarker.position.y = 0.012;
  scene.add(groundMarker);

  var g = new THREE.BufferGeometry();
  dropPos = new Float32Array(6);
  g.setAttribute('position', new THREE.BufferAttribute(dropPos, 3));
  dropLine = new THREE.Line(g, new THREE.LineDashedMaterial({
    color:0x0071e3, transparent:true, opacity:0.45, dashSize:0.06, gapSize:0.05
  }));
  dropLine.frustumCulled = false;
  scene.add(dropLine);

  for (var r=1;r<=4;r++){
    var c = new THREE.Mesh(
      new THREE.RingGeometry(r - 0.007, r + 0.007, 96),
      new THREE.MeshBasicMaterial({ color:0xc2c2c9, transparent:true, opacity:0.7, side:THREE.DoubleSide })
    );
    c.rotation.x = -Math.PI/2;
    c.position.y = 0.006;
    scene.add(c);
  }
}

function updateGroundGuides(){
  if (!groundMarker || !dropLine) return;
  var show = sim.y > 4;
  groundMarker.visible = show;
  dropLine.visible = show;
  groundMarker.position.set(sim.x*CM, 0.012, sim.z*CM);
  groundMarker.rotation.y = sim.yaw * Math.PI/180;
  dropPos[0] = sim.x*CM; dropPos[1] = 0.012; dropPos[2] = sim.z*CM;
  dropPos[3] = sim.x*CM; dropPos[4] = sim.y*CM; dropPos[5] = sim.z*CM;
  dropLine.geometry.attributes.position.needsUpdate = true;
  dropLine.computeLineDistances();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
